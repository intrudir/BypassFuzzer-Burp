plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.0.0-beta4'
}

group = 'com.bypassfuzzer'
version = '1.4.2'

subprojects {
    group = rootProject.group
    version = rootProject.version
    repositories {
        mavenCentral()
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':core')

    // Burp Montoya API (provided by Burp at runtime)
    compileOnly 'net.portswigger.burp.extensions:montoya-api:2023.12.1'
    testImplementation 'net.portswigger.burp.extensions:montoya-api:2023.12.1'

    // JSON processing
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.yaml:snakeyaml:2.2'

    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
    testImplementation 'org.mockito:mockito-core:5.8.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.1'
}

tasks.register('cliShadowJar') {
    group = 'build'
    description = 'Builds the standalone BypassFuzzer CLI fat JAR.'
    dependsOn ':cli:shadowJar'
}

tasks.register('cliDistZip') {
    group = 'distribution'
    description = 'Builds the standalone BypassFuzzer CLI distribution archive.'
    dependsOn ':cli:distZip'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

// Keep compilation consistent across Windows, macOS, and Linux. Several
// URL-validation sources intentionally document Unicode compatibility payloads.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

def generatedBuildInfoDir = layout.buildDirectory.dir('generated/resources/buildInfo')
def defaultUpdateManifestUrl = 'https://wapen-tools-1.s3.us-east-1.amazonaws.com/bypassfuzzer_version.txt'
def updateManifestUrlProvider = providers.gradleProperty('updateManifestUrl').orElse(defaultUpdateManifestUrl)
def devLatestVersionProvider = providers.gradleProperty('devLatestVersion').orElse('')

tasks.register('generateBuildInfo', WriteProperties) {
    destinationFile = generatedBuildInfoDir.map { it.file('bypassfuzzer-build.properties') }
    property('version', project.version.toString())
    property('updateManifestUrl', updateManifestUrlProvider.get())
    property('devLatestVersion', devLatestVersionProvider.get())
}

sourceSets {
    main {
        resources {
            srcDir generatedBuildInfoDir
        }
    }
}

tasks.named('processResources') {
    dependsOn tasks.named('generateBuildInfo')
}

tasks.withType(Jar).configureEach {
    manifest {
        attributes(
            'Implementation-Title': 'BypassFuzzer',
            'Implementation-Version': project.version.toString()
        )
    }
}

// Create fat JAR with dependencies
tasks.register('cleanShadowJarArtifacts', Delete) {
    delete fileTree(layout.buildDirectory.dir('libs')) {
        include 'bypassfuzzer-burp-*.jar'
        include 'bypassfuzzer-burp.jar'
        include 'bypassfuzzer.jar'
    }
}

shadowJar {
    dependsOn tasks.named('cleanShadowJarArtifacts')
    archiveClassifier.set('')
    archiveBaseName.set('bypassfuzzer')
    archiveVersion.set('')
    minimize()
}

tasks.named('test') {
    useJUnitPlatform()
    // The attack-playbook smoke suite starts a local lab and performs real
    // HTTP traffic. Keep it out of the normal build loop; run it explicitly
    // with smokeTestPlaybooks or -PincludeSmokeTests=true.
    if (!providers.gradleProperty('includeSmokeTests').map { it.toBoolean() }.orElse(false).get()) {
        exclude '**/AttackPlaybookSmokeTest.class'
    }
}

tasks.register('fullTest', Test) {
    useJUnitPlatform()
    description = 'Runs the complete test suite, including attack-playbook smoke tests.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
}

tasks.register('smokeTestPlaybooks', Test) {
    useJUnitPlatform()
    description = 'Runs attack-driven smoke tests against the local vulnerable lab.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/AttackPlaybookSmokeTest.class'
}

tasks.register('runSweepHarness', JavaExec) {
    dependsOn tasks.named('testClasses')
    group = 'verification'
    description = 'Runs the authorised-target live Coverage Sweep harness.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.bypassfuzzer.burp.core.coverage.SweepHarness'
    jvmArgs '-Djdk.httpclient.allowRestrictedHeaders=host,connection,content-length'
    if (project.hasProperty('harnessArgs')) {
        args project.property('harnessArgs').toString().split(' ')
    }
}

// Make shadowJar the default build artifact
build.dependsOn shadowJar, ':core:test', ':cli:test', ':cli:shadowJar', ':cli:distZip'
